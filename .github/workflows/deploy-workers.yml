name: Deploy to Cloudflare Workers

on:
  push:
    branches: [cloudflare/main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set commit message
        env:
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: echo "COMMIT_MSG=$(printf '%s' "$HEAD_COMMIT_MSG" | head -1 | sed 's/[\"\\]//g')" >> "$GITHUB_ENV"

      - name: Notify Slack (start)
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"blocks":[{"type":"section","text":{"type":"mrkdwn","text":"🚀 *블로그 배포 시작* — yongseok.me"}},{"type":"context","elements":[{"type":"mrkdwn","text":"${{ env.COMMIT_MSG }} · ${{ github.actor }} · <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|빌드 로그>"}]}]}

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack (for pnpm)
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # NOTE: do NOT cache ~/.cache/puppeteer. A restored partial / cross-lockfile
      # cache leaves the browser folder present but the chrome-headless-shell binary
      # missing, and puppeteer's postinstall then ERRORS instead of re-downloading
      # (this broke a deploy). Let puppeteer fetch Chromium fresh each run.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"blocks":[{"type":"section","text":{"type":"mrkdwn","text":"✅ *블로그 배포 완료* — yongseok.me"}},{"type":"section","fields":[{"type":"mrkdwn","text":"*커밋:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"},{"type":"mrkdwn","text":"*환경:*\nProduction (Workers)"}]},{"type":"context","elements":[{"type":"mrkdwn","text":"${{ env.COMMIT_MSG }} · ${{ github.actor }} · <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|빌드 로그>"}]}]}

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"blocks":[{"type":"section","text":{"type":"mrkdwn","text":"❌ *블로그 배포 실패*"}},{"type":"section","fields":[{"type":"mrkdwn","text":"*커밋:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"},{"type":"mrkdwn","text":"*환경:*\nProduction (Workers)"}]},{"type":"context","elements":[{"type":"mrkdwn","text":"${{ env.COMMIT_MSG }} · ${{ github.actor }} · <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|빌드 로그>"}]}]}
