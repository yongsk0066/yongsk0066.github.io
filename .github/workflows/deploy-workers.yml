name: Deploy to Cloudflare Workers

on:
  push:
    branches: [cloudflare/main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (for Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build site
        run: yarn build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "✅ *블로그 배포 완료* — yongseok.me"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*커밋:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                  - type: mrkdwn
                    text: "*환경:*\nProduction (Workers)"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "${{ github.event.head_commit.message }} · ${{ github.actor }}"

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "❌ *블로그 배포 실패*"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*커밋:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                  - type: mrkdwn
                    text: "*로그:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|확인하기>"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "${{ github.event.head_commit.message }} · ${{ github.actor }}"
