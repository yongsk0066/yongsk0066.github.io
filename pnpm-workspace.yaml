# pnpm 12 project config (migrated from Yarn 4 → pnpm 11 → pnpm 12).
# Since pnpm 11 all non-auth settings live here instead of .npmrc; pnpm 12 rejects unknown keys.

# Flat node_modules like Yarn's node-linker. Keeps the heavy client-side
# React-Three-Fiber/Three.js runtime behaviour identical to the previous Yarn
# setup, while pnpm still uses its global content-addressable store + hard links.
# Switch to `isolated` later if you want pnpm's strict phantom-dependency guard.
nodeLinker: hoisted

# Delay newly published versions for 24 hours as a supply-chain safety window.
# The dependency tree now follows stable Astro releases, so no exception is needed.
minimumReleaseAge: 1440

# Include GitHub Actions when checking for updates with `pnpm outdated`.
update:
  githubActions: true

# Replaces Yarn's `resolutions`: pin transitive React to the installed version.
overrides:
  react: "19.3.1"
  react-dom: "19.3.1"
  # Math integrations still request KaTeX 0.16, which is affected by
  # GHSA-238p-pmpm-9mq7. Keep rendering and its CSS on the same patched version.
  katex: "0.19.0"
  # typography 0.5.20 pins selector-parser 6.0.10 (GHSA-rj75-hqrm-r3gf).
  "@tailwindcss/typography>postcss-selector-parser": "7.1.6"

# pnpm 11+ blocks dependency build scripts by default (strictDepBuilds). Allow the
# native deps that legitimately need to build / run postinstall.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  es5-ext: true
